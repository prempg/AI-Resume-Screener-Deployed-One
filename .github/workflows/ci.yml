name: CI Pipeline

on:
  push:
    branches:
      - resume-analyzer-v2
  pull_request:
    branches:
      - resume-analyzer-v2

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax
        run: |
          python -m py_compile app/main.py
          python -m py_compile app/streamlit_app.py
          python -m py_compile app/services/groq_service.py
          python -m py_compile app/utils/report_generator.py

      - name: Import smoke tests
        env:
          GROQ_API_KEY: test-placeholder-key
        run: |
          python -c "from app.utils.report_generator import generate_analysis_pdf, generate_analysis_json; print('report imports ok')"
          python -c "from app.evaluators.ats_evaluator import calculate_ats_score; print('ATS evaluator import ok')"

      - name: Validate Docker Compose
        run: |
          touch .env
          echo "GROQ_API_KEY=test-placeholder-key" >> .env
          docker compose -f docker-compose.prod.yaml config --quiet

      - name: Build Docker images
        run: |
          docker compose -f docker-compose.prod.yaml build